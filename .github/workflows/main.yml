
name: Generate Stats Images

on:
  push:
    branches:
      - main
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Build
        run: zig build

      - name: Generate images
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"
          MAX_RETRIES: 5
        run: |
          # Always exclude this repository from its own statistics.
          if [[ -n "$EXCLUDE_REPOS" ]]; then
            EXCLUDE_REPOS="${EXCLUDE_REPOS},Ceebug/github-stats,Ceebug/Ceebug.is-a.dev"
          else
            EXCLUDE_REPOS="Ceebug/github-stats"
          fi

          export EXCLUDE_REPOS

          ./zig-out/bin/github-stats

      - name: Commit to the repo
        run: |
          # Save generated images outside the repository.
          mkdir -p "$RUNNER_TEMP/generated"
          cp overview.svg languages.svg "$RUNNER_TEMP/generated/"

          # Fetch the latest remote generated branch.
          git fetch origin generated

          # Remove untracked and ignored build artifacts.
          git clean -fdx

          # Switch to the exact remote branch tip.
          git checkout -B generated origin/generated

          # Remove any previously committed build artifacts.
          git rm -r --ignore-unmatch .zig-cache zig-out

          # Restore generated images.
          cp "$RUNNER_TEMP/generated/overview.svg" .
          cp "$RUNNER_TEMP/generated/languages.svg" .

          # Configure commit identity.
          git config user.name "github-stats[bot]"
          git config user.email "github-stats[bot]@users.noreply.github.com"

          # Commit only if the generated images changed.
          git add -- overview.svg languages.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update generated files"
            git push origin generated
          else
            echo "No generated image changes."
          fi
